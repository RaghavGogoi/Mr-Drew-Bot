<!DOCTYPE html>
<html>
<head>
    <title>Logging in...</title>
    <style>
        body { background: #020617; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <h2>Authenticating with Mr. Drew Bot...</h2>
        <p>You will be redirected shortly.</p>
    </div>

    <script>
        // 1. Get the "code" from the URL (?code=XYZ...)
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        if (code) {
            // 2. Send the code to your Bot's backend
            fetch('https://mr-drew-bot.onrender.com/api/auth/discord/callback',{
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code })
            })
            .then(res => res.json())
            .then(data => {
                if (data.token) {
                    // 3. Store user data in the browser so the dashboard knows who you are
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.user.username);
                    localStorage.setItem('avatar', data.user.avatar);
                    localStorage.setItem('discordId', data.user.dId);
                    
                    // 4. Go back to the dashboard
                    window.location.href = '/index.html';
                }
            })
            .catch(err => {
                console.error(err);
                document.body.innerHTML = "<h2>Authentication Failed. Please try again.</h2>";
            });
        }
    </script>
</body>
</html>
